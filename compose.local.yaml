# Stack completa para uso local; execute este arquivo sozinho.
# As credenciais abaixo são exclusivas de desenvolvimento.
name: menuzap-local

services:
  database:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    restart: unless-stopped
    environment:
      POSTGRES_DB: menuzap
      POSTGRES_USER: menuzap
      POSTGRES_PASSWORD: menuzap-local-db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U menuzap -d menuzap']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [data]

  backend:
    build: ./backend
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      DATABASE_URI: postgres://menuzap:menuzap-local-db@database:5432/menuzap
      PARSE_APPLICATION_ID: menuzap-local
      PARSE_JAVASCRIPT_KEY: menuzap-local-public-key
      PARSE_MASTER_KEY: menuzap-local-master-key-development-only
      PUBLIC_ORIGIN: http://localhost:${MENUZAP_LOCAL_PORT:-8080}
      FILES_DIRECTORY: /app/var/files
    volumes:
      - parse_files:/app/var/files
    depends_on:
      database:
        condition: service_healthy
    networks: [data, edge]
    stop_grace_period: 30s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_PARSE_APPLICATION_ID: menuzap-local
        VITE_PARSE_JAVASCRIPT_KEY: menuzap-local-public-key
        VITE_PARSE_SERVER_URL: http://localhost:${MENUZAP_LOCAL_PORT:-8080}/parse
    restart: unless-stopped
    environment:
      SITE_ADDRESS: http://:80
    ports:
      - '127.0.0.1:${MENUZAP_LOCAL_PORT:-8080}:80'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [edge]

volumes:
  postgres_data:
  parse_files:
  caddy_data:
  caddy_config:

networks:
  data:
    internal: true
  edge:
